name: Images

# Pushes container images when a release is published, which for this project
# means a person publishing the draft release.yml created. Publishing is the
# review step: a draft that is deleted instead never reaches the registry.
#
# Releases created or published with the workflow's own GITHUB_TOKEN do not
# trigger other workflows, so this cannot fire from release.yml by itself.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  images:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # The app is pure Go, so it ships for both architectures and Apple
          # Silicon hosts run it natively. The runner is built on the CUDA
          # llama.cpp image, which is amd64-only.
          - image: woolwire
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: woolwire-runner
            dockerfile: Dockerfile.runner
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # A release can be drafted by hand in the UI on any tag, bypassing
      # release.yml. Hold images to the same rules it enforces.
      - name: Release tag is a version on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::${TAG} is not a vX.Y.Z release tag."
            exit 1
          fi
          commit=$(git rev-parse "${TAG}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${TAG} points at ${commit}, which is not on main."
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}

      # Only the final stage of a foreign platform is emulated; the Dockerfile
      # cross-compiles everything else on the runner's own architecture.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
