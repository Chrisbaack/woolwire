name: Release

# Runs only for an actual release tag (vX.Y.Z), never on ordinary pushes or
# pull requests, so it costs nothing between releases. See
# docs/PUBLISHING.md before pushing the first tag.
#
# A tag produces a **draft** GitHub Release and nothing else. Container images
# are pushed by images.yml only once that draft is published, so a discarded
# draft leaves nothing public behind.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  on-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be pushed on any commit, including one from a branch that
      # never passed review. Only release what main already contains.
      - name: Tagged commit is reachable from main
        run: |
          commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${commit}, which is not on main."
            exit 1
          fi

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  binaries:
    name: Build binaries (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [on-main, ci]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          ldflags="-s -w -X github.com/Chrisbaack/woolwire/internal/buildinfo.version=${VERSION}"
          mkdir -p dist
          go build -trimpath -ldflags="$ldflags" -o "dist/woolwire-${GOOS}-${GOARCH}${ext}" ./cmd/woolwire
          go build -trimpath -ldflags="$ldflags" -o "dist/woolwire-runner-${GOOS}-${GOARCH}${ext}" ./cmd/woolwire-runner

      # The runner can execute the binaries built for its own platform, so
      # check the stamp actually took on those.
      - name: Version stamp
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          for cmd in woolwire woolwire-runner; do
            got=$("dist/${cmd}-linux-amd64" -version)
            [ "$got" = "${cmd} ${GITHUB_REF_NAME}" ] || { echo "::error::${cmd} reports '${got}'"; exit 1; }
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum * > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Draft release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        working-directory: dist
        run: |
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
