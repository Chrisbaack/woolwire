name: Feature request
description: Suggest a change to what Woolwire does.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [feature guide](https://github.com/Chrisbaack/woolwire/blob/HEAD/docs/FEATURES.md)
        for what exists today and the
        [roadmap](https://github.com/Chrisbaack/woolwire/blob/HEAD/docs/QOL_ROADMAP.md)
        for what is already proposed.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Woolwire makes hard or impossible?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including whether an existing feature nearly covers it.
    validations:
      required: false
  - type: checkboxes
    id: trust
    attributes:
      label: Trust model
      description: >
        Woolwire's boundaries are described in
        [SECURITY.md](https://github.com/Chrisbaack/woolwire/blob/HEAD/SECURITY.md).
      options:
        - label: I have considered whether this changes who can read chats, who controls admission, or what leaves the installation.
          required: false
