openapi: 3.1.0
info:
  title: Woolwire API
  description: |
    HTTP API for Woolwire's owner, compatible-client, peer, bootstrap, and runner interfaces.

    **Local owner API** (`/api/v1`) uses a session cookie obtained from the
    one-time setup secret. **Compatible-client API** (`/v1`) instead requires
    the local API bearer token. Both use the app listener, published to
    loopback by default. Every state-changing request must carry an `Origin` matching
    the request's own host or the `X-Woolwire-Request` header. JSON routes
    reject any content type other than `application/json`. Without this, a
    page served from another port on 127.0.0.1 is same-site to the browser
    and could act with the owner's session.

    **Peer API** (`/peer/v1`) is served over the transport under mutual TLS
    1.3. A connection completes only when the client certificate's Ed25519
    key belongs to an admitted member whose membership verifies against the
    pinned room authority. The caller's identity comes from that certificate,
    so a caller-supplied member id is never the authentication authority.

    **Bootstrap API** (`/bootstrap/v1`) is served only by the room creator, on
    the peer port plus one, under a certificate signed by the room authority.
    The joiner pins that authority from its invitation code. The creator takes
    the joining device's key from its certificate.

    **Runner API** (`/runner/v1`) is served by the companion runner container
    on an internal network and always requires a bearer token.
  version: 2.0.0

servers:
  - url: http://127.0.0.1:7070
    description: Local owner interface

tags:
  - name: setup
  - name: room
  - name: room-admin
  - name: models
  - name: chats
  - name: community
  - name: contributions
  - name: openai
  - name: peer
  - name: bootstrap
  - name: runner

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: woolwire_session
    localAPIToken:
      type: http
      scheme: bearer
      description: |
        Token for the OpenAI-compatible routes, generated on first boot and
        readable from `GET /api/v1/local-api-token`. It is always required.
    runnerToken:
      type: http
      scheme: bearer
    peerCertificate:
      type: mutualTLS
      description: |
        The peer's device certificate. Its Ed25519 key must name an admitted
        member of this room.

    bootstrapCertificate:
      type: mutualTLS
      description: |
        Joining device certificate proving possession of its key. It need not
        belong to an already admitted member. The invitation supplies the
        pinned server authority and the admission secret is sent in the body.

  parameters:
    csrfHeader:
      name: X-Woolwire-Request
      in: header
      required: true
      description: |
        Required on every state-changing request unless a matching `Origin`
        header is present. A cross-origin page cannot set it without a
        preflight, and the preflight is refused.
      schema:
        type: string
        enum: ['1']

  schemas:
    Membership:
      type: object
      properties:
        member_id: { type: string }
        room_id: { type: string }
        device_public: { type: string }
        display_name: { type: string }
        status:
          type: string
          enum: [admitted, pending, removed]
        roster_version: { type: integer, format: int64 }
        signature:
          type: string
          description: Ed25519 signature by the room authority.
        sig_version:
          type: integer
          description: |
            Signing payload format. 1 is the canonical length-prefixed,
            domain-separated encoding; 0 is the legacy colon-joined form kept
            only so records written before the change still verify.

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content: { type: string }

    HostedModel:
      type: object
      properties:
        id:
          type: string
          description: Opaque room-wide identifier.
        name:
          type: string
          description: Owner-facing display name.
        backend_model:
          type: string
          description: |
            What the backend server is sent in the OpenAI `model` field.
            Defaults to `name`; the opaque `id` is never sent to a backend.
        model_type:
          type: string
          enum: [external, managed]
        endpoint_url:
          type: string
          description: |
            For external models, use the backend server root (for example
            http://127.0.0.1:8081). The adapter appends /v1/chat/completions
            unless the URL already ends in /chat/completions; a base ending
            only in /v1 would be doubled.
        api_key:
          type: string
          description: Optional external backend bearer credential. Owner records may include it.
        context_limit: { type: integer }
        max_tokens: { type: integer }
        enabled: { type: boolean }
        published: { type: boolean }
        revision: { type: integer }
        allow_private_network:
          type: boolean
          description: |
            Allows this endpoint to use private ranges, private-network HTTP,
            and non-standard ports. Off by default. Metadata and other
            prohibited destinations remain blocked.

    CommunityEvent:
      type: object
      properties:
        id: { type: string }
        room_id: { type: string }
        channel_id: { type: string }
        author_member_id: { type: string }
        author_seq: { type: integer, format: int64 }
        event_type:
          type: string
          enum: [message, edit, delete, tombstone, channel]
        target_event_id: { type: string }
        content: { type: string }
        timestamp: { type: integer, format: int64 }
        signature: { type: string }
        sig_version: { type: integer }

    Receipt:
      type: object
      properties:
        request_id: { type: string }
        room_id: { type: string }
        host_member_id: { type: string }
        requester_member_id: { type: string }
        timestamp: { type: integer, format: int64 }
        completed: { type: boolean }
        host_signature: { type: string }
        requester_signature: { type: string }
        sig_version: { type: integer }

    ModelAd:
      type: object
      properties:
        room_id: { type: string }
        host_member_id: { type: string }
        model_id: { type: string }
        revision: { type: integer }
        name: { type: string }
        context_limit: { type: integer }
        availability:
          type: string
          enum: [ready, busy, offline]
        queue_estimate: { type: integer }
        is_managed: { type: boolean }
        timestamp: { type: integer, format: int64 }
        signature: { type: string }
        sig_version: { type: integer }

  responses:
    Unauthorized:
      description: No valid session cookie.
    CSRFRefused:
      description: |
        Cross-site request refused: the request had neither a matching
        `Origin` nor `X-Woolwire-Request`, or used a disallowed content type.
    CreatorOnly:
      description: This route requires the room authority.

security:
  - sessionCookie: []

paths:
  # ---------------------------------------------------------------- setup ---
  /api/v1/setup:
    post:
      tags: [setup]
      summary: Exchange the one-time setup secret for a session cookie
      description: |
        The secret is single-use. Once redeemed it returns 410 forever; mint
        another from an authenticated session. Failed attempts are rate
        limited per client address with exponential backoff.
      security: []
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Session established. Sets `woolwire_session`, SameSite=Strict.
        '401':
          description: Invalid setup secret.
        '403':
          $ref: '#/components/responses/CSRFRefused'
        '410':
          description: The setup secret has already been redeemed.
        '429':
          description: Too many failed attempts. `Retry-After` gives the delay.

  /api/v1/setup/info:
    get:
      tags: [setup]
      summary: Report whether an unredeemed setup secret is outstanding
      description: The secret itself is never returned.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  redeemed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/setup/token:
    post:
      tags: [setup]
      summary: Mint a new one-time setup secret
      description: |
        With an empty body, generates a 128-bit secret. A custom secret must
        be at least 12 characters. The value is returned once.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  token: { type: string }
        '400':
          description: The custom secret is shorter than 12 characters.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/local-api-token:
    get:
      tags: [setup]
      summary: Read the bearer token for the OpenAI-compatible routes
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/local-api-token/regenerate:
    post:
      tags: [setup]
      summary: Rotate the OpenAI-compatible bearer token
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------------- room ---
  /api/v1/state:
    get:
      tags: [room]
      summary: Get local installation and room state
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }
                  display_name: { type: string }
                  device_public: { type: string }
                  member_id: { type: string }
                  room:
                    type: object
                    nullable: true
                    properties:
                      room_id: { type: string }
                      room_name: { type: string }
                      role:
                        type: string
                        enum: [creator, member]
                      invitation_code:
                        type: string
                        description: |
                          Present only for the creator. Members never hold an
                          invitation code.
                      approval_mode: { type: boolean }
                      roster_version: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/profile:
    post:
      tags: [room]
      summary: Update the display name
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name: { type: string }
      responses:
        '200': { description: Profile updated. }
        '400': { description: Empty display name. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/room/host:
    post:
      tags: [room]
      summary: Create a room
      description: |
        Generates the room authority, the invitation, and the authority-signed
        bootstrap certificate, then starts the peer and bootstrap listeners.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_name]
              properties:
                room_name: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id: { type: string }
                  invitation_code: { type: string }
        '400':
          description: Missing room name, or no display name is set yet.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Already in a room. }

  /api/v1/room/join:
    post:
      tags: [room]
      summary: Join a room using an invitation code
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitation_code]
              properties:
                invitation_code: { type: string }
      responses:
        '200':
          description: |
            Admitted, or pending when the creator requires approval, or
            rejected with a reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [admitted, pending, rejected]
                  room_id: { type: string }
                  reason: { type: string }
        '400': { description: "Invalid code, or no display name is set yet." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Admission rejected by the creator. }
        '409': { description: Already in a room. }
        '502':
          description: |
            The creator was unreachable, or its bootstrap certificate is not
            signed by the authority in the invitation.

  /api/v1/room/leave:
    post:
      tags: [room]
      summary: Leave the current room
      description: Stops the peer listener before clearing room state.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Left the room. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ----------------------------------------------------------- room-admin ---
  /api/v1/room-admin/invitation/rotate:
    post:
      tags: [room-admin]
      summary: Rotate the invitation code
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invitation_code: { type: string }
        '403': { $ref: '#/components/responses/CreatorOnly' }

  /api/v1/room-admin/members:
    get:
      tags: [room-admin]
      summary: List room members
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/CreatorOnly' }

  /api/v1/room-admin/pending:
    get:
      tags: [room-admin]
      summary: List devices waiting for approval
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '403': { $ref: '#/components/responses/CreatorOnly' }

  /api/v1/room-admin/members/{id}/approve:
    post:
      tags: [room-admin]
      summary: Admit a pending device
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Member admitted. }
        '403': { $ref: '#/components/responses/CreatorOnly' }
        '404': { description: No such member. }
        '409': { description: The member is not pending. }

  /api/v1/room-admin/members/{id}/remove:
    post:
      tags: [room-admin]
      summary: Remove a member
      description: |
        Signs a removal at a higher roster version, cancels that member's
        queued and running work, forgets their address, and pushes the update
        to peers. Rotates the invitation code by default.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                rotate_invitation:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  invitation_code: { type: string }
        '403': { $ref: '#/components/responses/CreatorOnly' }
        '404': { description: No such member. }

  /api/v1/room-admin/approval-mode:
    post:
      tags: [room-admin]
      summary: Require creator approval for new devices
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approval_mode]
              properties:
                approval_mode: { type: boolean }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  approval_mode: { type: boolean }
        '403': { $ref: '#/components/responses/CreatorOnly' }

  # --------------------------------------------------------------- models ---
  /api/v1/hosted-models:
    get:
      tags: [models]
      summary: List locally hosted models
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HostedModel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      summary: Create or update a hosted model
      description: |
        Whole-record save, not PATCH. Send all desired fields when updating,
        including id, backend credentials, enabled, and published. Omitted
        fields may reset to defaults. Use the managed load route for GGUFs.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HostedModel' }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostedModel' }
        '400':
          description: |
            Missing name, or the endpoint is refused by the destination
            policy (metadata address, blocked range, blocked port, or plain
            HTTP off-machine without the private-network opt-in).
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/hosted-models/{id}:
    delete:
      tags: [models]
      summary: Delete a hosted model
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/hosted-models/test:
    post:
      tags: [models]
      summary: Test reachability of a model endpoint
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                endpoint_url: { type: string }
                api_key: { type: string }
                allow_private_network: { type: boolean }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: integer }
                  models:
                    type: array
                    items: { type: string }
                  error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/hosted-models/discover:
    post:
      tags: [models]
      summary: List the models an endpoint offers
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint_url]
              properties:
                endpoint_url: { type: string }
                api_key: { type: string }
                allow_private_network: { type: boolean }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  models:
                    type: array
                    items: { type: string }
                  error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/host-limits:
    get:
      tags: [models]
      summary: Read the fair-queue limits
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  MaxActive: { type: integer }
                  MaxQueuedPerMember: { type: integer }
                  MaxQueuedTotal: { type: integer }
                  QueueTimeoutSeconds: { type: integer }
                  ExecutionTimeoutSeconds: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [models]
      summary: Update the fair-queue limits
      description: |
        Applies to the shared queue immediately. Uses PascalCase record keys.
        Omitted or non-positive fields reset to defaults; send the whole record.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Limits saved. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/hardware:
    get:
      tags: [models]
      summary: Detected CPU, memory, and GPU profile
      responses:
        '200': { description: Hardware profile. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/catalog:
    get:
      tags: [models]
      summary: Models offered by this node and its peers
      description: |
        Queries every known peer over an authenticated connection. An
        advertisement is accepted only from the member the handshake proved,
        and only if that member's signature verifies.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/ModelAd'
                    - type: object
                      properties:
                        host_display_name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------- managed models ---
  /api/v1/managed-models/artifacts:
    get:
      tags: [models]
      summary: List available GGUF models
      description: |
        Returns the weights Woolwire downloaded, which carry a manifest, plus
        the GGUF language models found by scanning the models directory. The
        scan understands a Hugging Face cache
        (`hub/models--org--repo/snapshots/<rev>/model.gguf`), skips GGUF files
        that are not language models, and lists only the first shard of a split
        model, with `size_bytes` covering every shard.
      responses:
        '200':
          description: Artifact manifests.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Stable identifier, safe in a URL path segment.
                    name: { type: string }
                    filename:
                      type: string
                      description: Base name of the weight file.
                    path:
                      type: string
                      description: |
                        Slash-separated location relative to the models
                        directory. This is what `load` and `delete` take.
                    size_bytes: { type: integer, format: int64 }
                    sha256:
                      type: string
                      description: Empty for a discovered model, which was never hashed.
                    context_limit: { type: integer }
                    installed_at: { type: integer, format: int64 }
                    source:
                      type: string
                      enum: [download, cache]
                      description: |
                        `download` for weights Woolwire installed and may
                        delete; `cache` for weights it only found.
                    repo_id:
                      type: string
                      description: The `org/repo` a Hugging Face cache filed the model under.
                    architecture:
                      type: string
                      description: Model family from the GGUF header.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/managed-models/storage:
    get:
      tags: [models]
      summary: Read model storage usage, budget, and read-only status
      description: |
        Returns only configured=false when no artifact manager is available.
        Otherwise used_bytes is the scanned usage (zero if scanning fails),
        and budget_bytes is the configured budget, not filesystem free space.
      responses:
        '200':
          description: Artifact storage status.
          content:
            application/json:
              schema:
                type: object
                required: [configured]
                properties:
                  configured: { type: boolean }
                  used_bytes: { type: integer, format: int64 }
                  budget_bytes: { type: integer, format: int64 }
                  read_only: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/managed-models/artifacts/{filename}:
    delete:
      tags: [models]
      summary: Delete a downloaded weight file
      description: |
        Only weights Woolwire downloaded can be deleted. A model discovered in
        the models directory is refused with 403: the directory may be a cache
        shared with other tools, and removing a file from one corrupts it for
        all of them.
      parameters:
        - name: filename
          in: path
          required: true
          description: |
            The artifact's `path`. May contain `/`, so it is matched as a
            trailing wildcard; each segment is URL-escaped separately.
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Deleted. }
        '400': { description: Invalid path. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Model was discovered, not installed by Woolwire." }

  /api/v1/managed-models/download:
    post:
      tags: [models]
      summary: Start a background weight download
      description: |
        Returns immediately with a job id. Poll
        `GET /api/v1/managed-models/downloads` for progress; a multi-gigabyte
        transfer is not held open inside a request.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_url, filename]
              properties:
                source_url:
                  type: string
                  description: Must be HTTPS and pass the destination policy.
                filename:
                  type: string
                  description: |
                    Must be a bare `.gguf` name with no path separators.
                    Downloads are always committed at the top level of the
                    models directory.
                expected_sha256: { type: string }
                max_size_bytes: { type: integer, format: int64 }
                companions:
                  type: array
                  description: |
                    Supporting files fetched with the model in the same job,
                    reported as one progress figure. Each is recorded against
                    the model and marked so it is never listed as a model
                    itself. Take these from the resolver's `companions`.
                  items:
                    type: object
                    required: [kind, source_url, filename]
                    properties:
                      kind: { type: string, enum: [projector, draft] }
                      source_url: { type: string }
                      filename: { type: string }
                      max_size_bytes: { type: integer, format: int64 }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_id: { type: string }
                  status: { type: string }
        '400': { description: "Rejected filename, URL, or storage budget." }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/managed-models/huggingface:
    get:
      tags: [models]
      summary: List the GGUF weights a Hugging Face repository publishes
      description: |
        Reads the repository's file listing so a download can be filled in from
        what is actually published. Only public repositories resolve; no
        credential is sent. Split models are returned once, as their first
        shard, sized across every shard.
      parameters:
        - name: repo
          in: query
          required: true
          description: A repository URL or a bare `org/name`.
          schema: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  repo: { type: string }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                          description: Location within the repository, which may include directories.
                        filename: { type: string }
                        size_bytes: { type: integer, format: int64 }
                        url:
                          type: string
                          description: Direct download URL, ready for the download endpoint.
                        quantization: { type: string }
                        shard_count:
                          type: integer
                          description: |
                            Above one when the model is split across files. Every
                            shard must be present before it will load, and the
                            download endpoint fetches one file at a time.
                        total_bytes:
                          type: integer
                          format: int64
                          description: The whole download — this model plus its companions.
                        companions:
                          type: array
                          description: |
                            Files that belong with this model, already chosen for
                            it: a multimodal projector, and a multi-token-prediction
                            module used as a speculative draft. Companions are never
                            listed as models of their own, and which precision to
                            take follows from the model rather than being a choice.
                          items:
                            type: object
                            properties:
                              kind: { type: string, enum: [projector, draft] }
                              path: { type: string }
                              filename: { type: string }
                              size_bytes: { type: integer, format: int64 }
                              url: { type: string }
        '400': { description: Not a repository reference. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: "No such public repository, or it holds no GGUF files." }
        '502': { description: Hugging Face could not be reached. }

  /api/v1/managed-models/downloads:
    get:
      tags: [models]
      summary: Download job status
      parameters:
        - name: id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    filename: { type: string }
                    status:
                      type: string
                      enum: [downloading, complete, failed, cancelled]
                    bytes_downloaded: { type: integer, format: int64 }
                    total_bytes: { type: integer, format: int64 }
                    error: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such job. }

  /api/v1/managed-models/downloads/{id}/cancel:
    post:
      tags: [models]
      summary: Cancel a download job
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such job. }

  /api/v1/managed-models/runner-health:
    get:
      tags: [models]
      summary: Runner companion status
      responses:
        '200': { description: Runner status. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/managed-models/load:
    post:
      tags: [models]
      summary: Load weights into the runner and advertise them
      description: |
        Waits for the engine to report healthy, then creates or updates the
        hosted-model row so the model appears in the catalog and can be
        served to peers.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id, filename]
              properties:
                model_id: { type: string }
                name: { type: string }
                filename: { type: string }
                context_limit: { type: integer }
                max_tokens: { type: integer }
                threads: { type: integer }
                gpu_layers:
                  type: integer
                  description: Omit for runner hardware-based offload; 0 forces CPU.
                published: { type: boolean }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostedModel' }
        '400': { description: Invalid filename. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: No runner is configured. }

  /api/v1/managed-models/unload:
    post:
      tags: [models]
      summary: Unload the runner's model and withdraw its advertisement
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Unloaded. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: No runner is configured. }

  # ---------------------------------------------------------------- chats ---
  /api/v1/chats:
    get:
      tags: [chats]
      summary: List conversations
      responses:
        '200': { description: Conversations. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [chats]
      summary: Create a conversation
      description: |
        A `no_save` conversation is never written to the messages table on any
        node; its transcript is kept in memory so it stays multi-turn.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                no_save: { type: boolean }
      responses:
        '200': { description: Created. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chats/{id}:
    get:
      tags: [chats]
      summary: Read a conversation and its messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Conversation and messages. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: No such conversation. }
    delete:
      tags: [chats]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chats/{id}/message:
    post:
      tags: [chats]
      summary: Send a message and stream the reply
      description: |
        Responds with Server-Sent Events. Data frames contain delta and
        request_id; named stats frames can contain timing/chunk estimates.
        Ignore keepalive comments and unknown event types. Successful streams
        end with data: [DONE]; errors can be named error events after HTTP 200.
        A disconnected stream without DONE is not proof of success. Local
        requests use the same fair queue as remote ones.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, host_member_id, model_id]
              properties:
                content: { type: string }
                host_member_id: { type: string }
                model_id: { type: string }
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: The model is offline or the host is unreachable. }

  /api/v1/chats/{id}/cancel:
    post:
      tags: [chats]
      summary: Cancel an in-flight request
      description: |
        Cancellation is scoped to the submitting member, both locally and on
        the host.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string }
                host_member_id: { type: string }
      responses:
        '200': { description: Cancellation requested. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/chats/{id}/messages/{msgID}/regenerate:
    post:
      tags: [chats]
      summary: Generate another answer for a turn
      description: |
        Produces an alternative to an existing assistant message. The previous
        answer is kept as a sibling and the new one becomes the visible take,
        so both remain reachable through the variant navigation. The model is
        sent the branch up to the replaced answer's parent, not the answer
        itself. Responds as an SSE stream, exactly like sending a message.

        Unavailable in a no-save conversation, which stores nothing to branch
        from, and returns `400` there. Omit the model fields to reuse the model
        that produced the original answer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: msgID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host_member_id: { type: string }
                model_id: { type: string }
      responses:
        '200':
          description: Server-sent event stream of the new answer.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Not an assistant message, or a no-save conversation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conversation or message not found. }
        '503': { description: The selected model is offline or the host is unreachable. }

  /api/v1/chats/{id}/messages/{msgID}/edit:
    post:
      tags: [chats]
      summary: Re-ask a question with new wording
      description: |
        Stores the edited question as a sibling of the original and generates
        an answer beneath it. The original wording, and the exchange that
        followed it, stay intact on their own branch.

        Unavailable in a no-save conversation and returns `400` there. Responds
        as an SSE stream.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: msgID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                host_member_id: { type: string }
                model_id: { type: string }
      responses:
        '200':
          description: Server-sent event stream of the answer to the edited question.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Not a user message, empty content, or a no-save conversation. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conversation or message not found. }
        '503': { description: The selected model is offline or the host is unreachable. }

  /api/v1/chats/{id}/messages/{msgID}/select:
    post:
      tags: [chats]
      summary: Switch which alternative of a turn is visible
      description: |
        Puts the named message on the visible branch in place of the sibling
        currently holding the slot. Everything below it comes back with it, so
        each alternative keeps its own continuation.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: msgID
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: The branch now runs through this message. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Conversation or message not found. }

  # ------------------------------------------------------------ community ---
  /api/v1/community/channels:
    get:
      tags: [community]
      summary: List channels
      description: |
        Channels are materialized from the replicated event log, so a channel
        created on any node is visible on all of them.
      responses:
        '200': { description: Channels. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [community]
      summary: Create a channel
      description: Publishes a signed `channel` event so it replicates.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string }
      responses:
        '200': { description: Channel created. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/community/channels/{id}/messages:
    get:
      tags: [community]
      summary: Read a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Materialized messages. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [community]
      summary: Post to a channel
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunityEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/community/channels/{id}/read:
    post:
      tags: [community]
      summary: Update local read and mute state
      description: Local only; never replicated.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                muted: { type: boolean }
      responses:
        '200': { description: Saved. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/community/messages/{id}:
    put:
      tags: [community]
      summary: Edit your own message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                channel_id: { type: string }
      responses:
        '200': { description: Edit published. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not the author. }
        '404': { description: No such message. }
    delete:
      tags: [community]
      summary: Delete your own message
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Deletion published. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Not the author. }
        '404': { description: No such message. }

  /api/v1/community/messages/{id}/moderate:
    post:
      tags: [community]
      summary: Tombstone a message as the room creator
      description: Signed with the room authority, so peers can verify it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
                channel_id: { type: string }
      responses:
        '200': { description: Tombstone published. }
        '403': { $ref: '#/components/responses/CreatorOnly' }

  /api/v1/community/sync:
    post:
      tags: [community]
      summary: Sync community events with peers now
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Sync attempted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------------- contributions ---
  /api/v1/contributions/leaderboard:
    get:
      tags: [contributions]
      summary: 30-day social recognition leaderboard
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  leaderboard:
                    type: array
                    items:
                      type: object
                      properties:
                        host_member_id: { type: string }
                        display_name: { type: string }
                        score: { type: integer }
                        distinct_members_helped: { type: integer }
                  disclaimer: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/contributions/settings:
    get:
      tags: [contributions]
      summary: Read the contributions opt-out
      responses:
        '200': { description: Settings. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [contributions]
      summary: Set the contributions opt-out
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opt_out]
              properties:
                opt_out: { type: boolean }
      responses:
        '200': { description: Saved. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/contributions/sync:
    post:
      tags: [contributions]
      summary: Sync receipts with peers now
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      responses:
        '200': { description: Sync attempted. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # -------------------------------------------------- metrics and backups ---
  /api/v1/metrics:
    get:
      tags: [setup]
      summary: Local metrics
      description: Reports the transport's public address, never a private key.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectivity:
                    type: object
                    properties:
                      tailcat_addr: { type: string }
                      known_peers: { type: integer }
                  storage: { type: object }
                  engine: { type: object }
                  queue:
                    type: object
                    properties:
                      active: { type: integer }
                      queued: { type: integer }
                  telemetry_enabled:
                    type: boolean
                    description: Always false.
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/backup/export:
    post:
      tags: [setup]
      summary: Export an encrypted backup
      description: |
        Written under the state directory and sealed with an Argon2id-derived
        key. The plaintext database holds the device private key, the node
        key, the session token, and every endpoint API key, so a passphrase is
        required.
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  backup_path: { type: string }
                  size_bytes: { type: integer, format: int64 }
                  encrypted: { type: boolean }
        '400': { description: Missing or too-short passphrase. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --------------------------------------------------- OpenAI compatibility --
  /v1/models:
    get:
      tags: [openai]
      summary: List available models (OpenAI-compatible)
      security:
        - localAPIToken: []
      responses:
        '200': { description: Model list. }
        '401': { description: Missing or wrong bearer token. }

  /v1/chat/completions:
    post:
      tags: [openai]
      summary: Chat completion (OpenAI-compatible)
      parameters:
        - $ref: '#/components/parameters/csrfHeader'
      description: |
        Requests for a self-hosted model go through the same fair queue as
        peer requests. Requests for a peer's model are forwarded over an
        authenticated peer connection. Only model, messages with string
        content, and stream are implemented. Per-request samplers, max_tokens,
        tools, and image content are not supported. Stream errors may arrive
        as named error events; non-stream errors are generally plain text.
      security:
        - localAPIToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/ChatMessage' }
                stream: { type: boolean }
      responses:
        '200':
          description: A completion object, or an SSE stream when `stream` is set.
        '401': { description: Missing or wrong bearer token. }
        '403': { $ref: '#/components/responses/CSRFRefused' }
        '404': { description: No such model. }

  # ------------------------------------------------------------- bootstrap --
  /bootstrap/v1/join:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: |
          The creator's bootstrap listener, on the peer port plus one, over
          TLS with a certificate signed by the room authority.
        variables:
          address: { default: '<creator tailcat address>' }
          port: { default: '4243' }
    post:
      tags: [bootstrap]
      summary: Request admission to a room
      description: |
        Served only by the creator; a member node runs no bootstrap listener
        at all. The joining device's key is taken from its TLS certificate,
        never from the body, and a device already admitted or previously
        removed is refused.
      security:
        - bootstrapCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id, invitation_id, admission_secret, display_name]
              properties:
                room_id: { type: string }
                invitation_id: { type: string }
                admission_secret: { type: string }
                display_name: { type: string }
                tailcat_addr: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [admitted, pending, rejected]
                  room_name: { type: string }
                  creator_member_id: { type: string }
                  membership: { $ref: '#/components/schemas/Membership' }
                  roster:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
                  peer_addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        MemberID: { type: string }
                        TailcatAddr: { type: string }
                  reason: { type: string }
        '400': { description: "Wrong room, missing display name, or no device certificate." }
        '403': { description: "This node is not the creator, or invitations are disabled." }
        '404': { description: No room on this node. }

  # ------------------------------------------------------------------ peer --
  /peer/v1/membership/sync:
    servers:
      - url: 'tailcat://{address}:{port}'
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Exchange roster updates
      description: |
        `tailcat_addr` updates only the authenticated caller's own address.
        There is no member id in the body: a member cannot rebind anyone
        else's address to a node it controls.
      security:
        - peerCertificate: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                known_version: { type: integer, format: int64 }
                tailcat_addr: { type: string }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster_version: { type: integer, format: int64 }
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
                  peer_addresses:
                    type: array
                    items: { type: object }
        '403': { description: The caller is not an admitted member. }
        '404': { description: No room on this node. }

  /peer/v1/catalog:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    get:
      tags: [peer]
      summary: Signed advertisements for this host's models
      security:
        - peerCertificate: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ModelAd' }
        '403': { description: The caller is not an admitted member. }

  /peer/v1/inference:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Request inference from this host
      description: |
        The requester is the authenticated TLS identity; there is no
        `member_id` field to claim someone else's. Responds with SSE:
        `data: {"delta":...}` frames, a `: ping` keepalive, an optional
        `event: receipt`, and a final `data: [DONE]`.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id, model_id, messages]
              properties:
                request_id: { type: string }
                model_id: { type: string }
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/ChatMessage' }
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Missing fields or oversized body. }
        '403': { description: The caller is not an admitted member. }
        '404': { description: No such model. }
        '413': { description: The prompt exceeds the model's context limit. }
        '429': { description: The member's queue allowance is exhausted. }
        '503': { description: The host queue is full. }

  /peer/v1/inference/cancel:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Cancel one of your own in-flight requests
      description: A request submitted by another member is not cancellable.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              properties:
                request_id: { type: string }
      responses:
        '200': { description: Cancelled. }
        '400': { description: Missing request id. }
        '403': { description: The caller is not an admitted member. }
        '404': { description: No such request belonging to the caller. }

  /peer/v1/community/sync:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Exchange community events using per-author cursors
      description: |
        The request carries one cursor per author rather than every known
        event id, so its size does not grow with the room's history. Loop on
        the returned cursors until a page comes back empty.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string }
                cursors:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                push_events:
                  type: array
                  items: { $ref: '#/components/schemas/CommunityEvent' }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull_events:
                    type: array
                    items: { $ref: '#/components/schemas/CommunityEvent' }
                  next_cursors:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
        '400': { description: Room mismatch or oversized body. }
        '403': { description: The caller is not an admitted member. }

  /peer/v1/contributions/sync:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Exchange contribution receipts using per-pair cursors
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id: { type: string }
                cursors:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                push_receipts:
                  type: array
                  items: { $ref: '#/components/schemas/Receipt' }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pull_receipts:
                    type: array
                    items: { $ref: '#/components/schemas/Receipt' }
                  next_cursors:
                    type: object
                    additionalProperties: { type: integer, format: int64 }
        '400': { description: Room mismatch or oversized body. }
        '403': { description: The caller is not an admitted member. }

  /peer/v1/contributions/ack:
    servers:
      - url: 'tailcat://{address}:{port}'
        description: Peer transport stream under TLS; not a host TCP HTTP endpoint.
        variables:
          address: { default: '<peer tailcat address>' }
          port: { default: '4242' }
    post:
      tags: [peer]
      summary: Return a counter-signed receipt to the host
      description: |
        The caller must be the receipt's requester, and both signatures must
        verify against the roster.
      security:
        - peerCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Receipt' }
      responses:
        '200': { description: Receipt stored. }
        '400': { description: Room mismatch or invalid signatures. }
        '403':
          description: |
            The caller is not an admitted member, or the receipt names a
            different requester.

  # ---------------------------------------------------------------- runner --
  /runner/v1/health:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    get:
      tags: [runner]
      summary: Engine status
      security:
        - runnerToken: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [idle, loading, ready, busy, error]
                  loaded_model_id: { type: string }
                  loaded_file:
                    type: string
                    description: The reference the runner was asked to load, relative to the models directory.
                  has_gpu:
                    type: boolean
                    description: Whether the runner container has a GPU device attached.
                  gpu_name: { type: string }
                  error:
                    type: string
                    description: |
                      Why the engine is in an error state, including the last
                      lines it printed before exiting.
                  notice:
                    type: string
                    description: |
                      Set when a load succeeded on different terms than asked —
                      currently, when speculative decoding had to be dropped.
                  engine_pid: { type: integer }
                  error: { type: string }
        '401': { description: Missing or wrong runner token. }

  /runner/v1/models/load:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    post:
      tags: [runner]
      summary: Launch the engine and wait for it to become healthy
      description: |
        Returns only once the engine's own health endpoint answers, so
        `ready` means loaded rather than merely started.
      security:
        - runnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id, filename]
              properties:
                model_id: { type: string }
                filename:
                  type: string
                  description: |
                    Slash-separated location of the weights relative to the
                    models directory. It may name a file in a subdirectory —
                    that is where a Hugging Face cache keeps them — but any
                    reference that leaves the directory is rejected. Symlinks
                    inside the directory are followed, since a cache stores
                    every snapshot entry as a link into its blobs directory.
                context_limit: { type: integer }
                threads: { type: integer }
                mmproj:
                  type: string
                  description: |
                    Multimodal projector to load with the model, relative to the
                    models directory. Without it a vision model serves as a
                    text-only one.
                draft_model:
                  type: string
                  description: |
                    Multi-token-prediction module to run as a speculative draft.
                    If the engine will not start with it, the model is loaded
                    without it and `notice` in the health response says so.
                gpu_layers:
                  type: integer
                  description: |
                    Layers to offload to the GPU. Omit it to let the runner
                    decide — it is the container the GPU is attached to, and
                    the caller cannot see one. Omitted, a runner with a GPU
                    leaves the split to the engine, which sizes it against the
                    VRAM actually free; a runner without one runs on the CPU.
                    An explicit `0` also means run on the CPU.
      responses:
        '200': { description: Engine ready. }
        '400': { description: Invalid model reference. }
        '401': { description: Missing or wrong runner token. }
        '404': { description: No such weight file. }
        '500':
          description: |
            The engine failed to launch or become healthy. The body quotes the
            last lines the engine printed, which is where a model the engine
            cannot read says so.

  /runner/v1/models/unload:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    post:
      tags: [runner]
      summary: Stop and reap the engine
      security:
        - runnerToken: []
      responses:
        '200': { description: Unloaded. }
        '401': { description: Missing or wrong runner token. }

  /runner/v1/engine/restart:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    post:
      tags: [runner]
      summary: Restart the engine with the same load arguments
      security:
        - runnerToken: []
      responses:
        '200': { description: "Restarted, or nothing was loaded." }
        '401': { description: Missing or wrong runner token. }
        '500': { description: The restart failed. }

  /runner/v1/inference:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    post:
      tags: [runner]
      summary: Run inference on the loaded model
      description: |
        The engine request is built from these fields; nothing else in the
        body reaches the engine. Requests are serialized, and the engine is
        restarted when the requesting member changes so no session state
        carries between members.
      security:
        - runnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items: { $ref: '#/components/schemas/ChatMessage' }
                stream: { type: boolean }
                max_tokens: { type: integer }
                requester_member_id: { type: string }
      responses:
        '200':
          description: SSE stream from the engine.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { description: Invalid body or unsupported message role. }
        '401': { description: Missing or wrong runner token. }
        '503': { description: No model is loaded. }

  /runner/v1/inference/cancel:
    servers:
      - url: 'http://woolwire-runner:8080'
        description: Companion runner on the internal network.
    post:
      tags: [runner]
      summary: Cancel the active inference
      security:
        - runnerToken: []
      responses:
        '200': { description: Cancellation requested. }
        '401': { description: Missing or wrong runner token. }
