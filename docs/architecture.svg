<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Woolwire architecture</title>
<desc id="desc">Each member runs a personal web app and database. Tailcat connects authenticated peers directly, with DERP rendezvous and relay fallback. Optional model runners remain isolated. The room creator controls admission, not inference routing or personal settings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73918b"/></marker></defs>
<style>text{font-family:Inter,system-ui,-apple-system,sans-serif} .title{font-size:42px;font-weight:750;fill:#f7f0df}.sub{font-size:18px;fill:#b2c9c2}.group{font-size:16px;font-weight:700;letter-spacing:2px;fill:#81c6b1}.box{fill:#203b38;stroke:#3e625a;stroke-width:1.5}.label{font-size:20px;font-weight:650;fill:#f5f0df}.small{font-size:16px;fill:#c0d0c8}.wire{fill:none;stroke:#73918b;stroke-width:2;marker-end:url(#arrow)}.accent{fill:#edb56b}.note{font-size:17px;fill:#c0d0c8}</style>
<rect width="1440" height="1080" fill="#102825"/>
<circle cx="66" cy="65" r="16" fill="#edb56b"/><path d="M 60 70 L 66 49 L 75 70 Z" fill="#102825"/>
<text x="100" y="78" class="title">Woolwire</text>
<text x="48" y="115" class="sub">A private room for shared intelligence · proposed architecture · September 2026</text>
<rect x="40" y="154" width="720" height="566" rx="20" fill="#17322f" stroke="#35574f"/>
<text x="64" y="189" class="group">YOUR INSTALLATION</text>
<rect x="945" y="154" width="455" height="566" rx="20" fill="#17322f" stroke="#35574f"/>
<text x="969" y="189" class="group">EACH FRIEND'S INSTALLATION</text>
<rect x="64" y="210" width="430" height="102" rx="12" class="box"/><text x="82" y="241" class="label">Your local web UI</text><text x="82" y="268" class="small">Dashboard · My chats · Community</text><text x="82" y="291" class="small">Settings apply only to you</text><rect x="510" y="210" width="225" height="102" rx="12" class="box"/><text x="528" y="241" class="label">Room admin</text><text x="528" y="268" class="small">Creator only</text><text x="528" y="291" class="small">Invites · members</text><rect x="64" y="349" width="430" height="126" rx="12" class="box"/><text x="82" y="380" class="label">Go application</text><text x="82" y="407" class="small">Separate local and peer APIs</text><text x="82" y="430" class="small">Authorization · catalog · queue · sync</text><text x="82" y="453" class="small">Personal conversations stay here</text><rect x="510" y="349" width="225" height="126" rx="12" class="box"/><text x="528" y="380" class="label">Local storage</text><text x="528" y="407" class="small">SQLite + identity files</text><text x="528" y="430" class="small">Settings and secrets</text><text x="528" y="453" class="small">Never room-replicated</text><rect x="64" y="527" width="670" height="93" rx="12" class="box"/><text x="82" y="558" class="label">Embedded Tailcat + app authentication</text><text x="82" y="585" class="small">Encrypted peer transport; room membership checked by Woolwire</text><text x="84" y="660" class="small">Host a room → share a reusable code</text><text x="84" y="687" class="small">Join a room → paste the code → discover available models</text><rect x="969" y="210" width="407" height="102" rx="12" class="box"/><text x="987" y="241" class="label">Their personal web UI</text><text x="987" y="268" class="small">Their conversations and settings</text><text x="987" y="291" class="small">Their own local database and identity</text><rect x="969" y="349" width="407" height="126" rx="12" class="box"/><text x="987" y="380" class="label">Their Go application</text><text x="987" y="407" class="small">Same authorization and hosting controls</text><text x="987" y="430" class="small">Creator need not route requests</text><text x="987" y="453" class="small">Each member can offer or use models</text><rect x="969" y="527" width="407" height="93" rx="12" class="box"/><text x="987" y="558" class="label">Their Tailcat connection</text><text x="987" y="585" class="small">Authenticated room members only</text><text x="989" y="661" class="small">Members connect to the selected host.</text><text x="989" y="687" class="small">Hosting a room ≠ hosting a model.</text><path d="M 270 312 V 349" class="wire"/><path d="M 620 312 V 333 H 450 V 349" class="wire"/><path d="M 494 413 H 510" class="wire"/><path d="M 270 475 V 527" class="wire"/><path d="M 1170 312 V 349" class="wire"/><path d="M 1170 475 V 527" class="wire"/><path d="M 734 565 H 969" class="wire" marker-start="url(#arrow)"/><text x="850" y="513" text-anchor="middle" class="small">Direct peer</text><text x="850" y="536" text-anchor="middle" class="small">connection</text><rect x="782" y="230" width="137" height="112" rx="12" class="box"/><text x="800" y="261" class="label">DERP</text><text x="800" y="288" class="small">Rendezvous</text><text x="800" y="311" class="small">Relay fallback</text><path d="M 782 291 H 773 V 548 H 734" class="wire" stroke-dasharray="7 6"/><path d="M 919 291 H 935 V 548 H 969" class="wire" stroke-dasharray="7 6"/><rect x="40" y="744" width="1360" height="155" rx="20" fill="#17322f" stroke="#35574f"/><text x="64" y="777" class="group">OPTIONAL HOSTING · CONFIGURED IN YOUR SETTINGS</text><rect x="64" y="794" width="670" height="82" rx="12" class="box"/><text x="82" y="825" class="label">Isolated managed runner</text><text x="82" y="852" class="small">Private controller + llama.cpp · separate volume · no Docker socket</text><rect x="780" y="794" width="596" height="82" rx="12" class="box"/><text x="798" y="825" class="label">External inference endpoint</text><text x="798" y="852" class="small">Owner-approved destination · limited inference routes</text><path d="M 64 440 H 51 V 786 H 100 V 794" class="wire"/><path d="M 494 456 H 501 V 730 H 767 V 835 H 780" class="wire"/><text x="800" y="745" class="small" opacity="0">Optional hosting connections</text><text x="48" y="946" class="label accent">Shared availability. Personal experience.</text>
<text x="48" y="978" class="note">Room data: presence, model ads, membership, community messages and optional contribution receipts.</text>
<text x="48" y="1006" class="note">Private data: your LLM history, hosting settings and secrets. Selected inference hosts receive submitted prompts.</text>
<text x="48" y="1034" class="note">Creator online for admission; established peers continue without them. Removal propagates as peers reconnect.</text>
</svg>
