services:
  woolwire:
    # The published image. WOOLWIRE_IMAGE_TAG picks a release (X.Y follows
    # patch releases within that minor version, X.Y.Z pins one). To build from
    # a checkout instead, add compose.source.yaml: see that file.
    image: ghcr.io/chrisbaack/woolwire:${WOOLWIRE_IMAGE_TAG:-0.1}
    container_name: woolwire-app
    # Default to 127.0.0.1:7070 for loopback isolation.
    # Set WOOLWIRE_HOST_PORT=0.0.0.0:7070 (or edit directly) to allow LAN device access.
    # Note: If connecting to LLM servers running directly on the host (e.g., Unsloth, Ollama, LM Studio on 127.0.0.1),
    # uncomment 'network_mode: host' (and comment out 'ports:').
    # network_mode: host
    ports:
      - "${WOOLWIRE_HOST_PORT:-127.0.0.1:7070}:7070"
    volumes:
      - woolwire_state:/state
    environment:
      - WOOLWIRE_STATE_DIR=/state
      - WOOLWIRE_LISTEN=0.0.0.0:7070
    security_opt:
      - no-new-privileges:true
    read_only: false
    user: "1000:1000"
    # Rootless Podman maps the container's UID 1000 to a high subordinate UID
    # on the host, so a bind-mounted models directory or state volume owned by
    # your own user is unreadable inside the container. Set
    # WOOLWIRE_USERNS_MODE=keep-id:uid=1000,gid=1000 in .env to map it back to
    # you instead. Leave it empty for Docker, which has no keep-id mode and
    # does not need one.
    userns_mode: ${WOOLWIRE_USERNS_MODE:-}

volumes:
  woolwire_state:
