# Managed profile: the Woolwire app plus a runner companion that executes
# local model weights.
#
# Networking is deliberately split. The app sits on both the default bridge
# and the internal network: it needs egress to reach DERP relays and
# tailcat.dev, and Docker does not publish host ports for a container attached
# only to an internal network, so an internal-only app was unreachable from
# the browser as well. The runner stays internal-only — it has no reason to
# reach the internet and nothing outside this compose file should reach it.
#
# The runner token is read from the environment. Generate one before the first
# `up` and keep it out of version control:
#
#   printf 'WOOLWIRE_RUNNER_TOKEN=%s\n' "$(openssl rand -hex 32)" >> .env
#
# `docker compose` and `podman-compose` both load ./.env automatically.
#
# Weights live in a named volume by default. To serve models you already have,
# point WOOLWIRE_MODELS at the directory holding them — a Hugging Face cache
# (the directory containing `hub/`, i.e. HF_HOME) works as-is, and so does any
# tree of .gguf files:
#
#   echo 'WOOLWIRE_MODELS=/path/to/huggingface' >> .env
#
# Woolwire scans that directory, ignores GGUF files that are not language
# models, and will not delete anything it did not download itself.

services:
  woolwire:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: woolwire-app
    # Default to 127.0.0.1:7070 for loopback isolation.
    # Set WOOLWIRE_HOST_PORT=0.0.0.0:7070 (or edit directly) to allow LAN device access.
    ports:
      - "${WOOLWIRE_HOST_PORT:-127.0.0.1:7070}:7070"
    volumes:
      - woolwire_state:/state
      - ${WOOLWIRE_MODELS:-woolwire_models}:/models
    environment:
      - WOOLWIRE_STATE_DIR=/state
      - WOOLWIRE_LISTEN=0.0.0.0:7070
      - WOOLWIRE_MODELS_DIR=/models
      - WOOLWIRE_RUNNER_URL=http://woolwire-runner:8080
      - WOOLWIRE_RUNNER_TOKEN=${WOOLWIRE_RUNNER_TOKEN:?set WOOLWIRE_RUNNER_TOKEN in .env, e.g. openssl rand -hex 32}
    networks:
      # egress reaches DERP and tailcat.dev and carries the published UI port;
      # woolwire_internal reaches the runner.
      - egress
      - woolwire_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M
    user: "1000:1000"

  runner:
    build:
      context: ../..
      dockerfile: Dockerfile.runner
    container_name: woolwire-runner
    restart: unless-stopped
    # No ports exposed to host or internet - private internal network only!
    volumes:
      # Read-only mount of model weights
      - ${WOOLWIRE_MODELS:-woolwire_models}:/models:ro
    environment:
      - RUNNER_TOKEN=${WOOLWIRE_RUNNER_TOKEN:?set WOOLWIRE_RUNNER_TOKEN in .env, e.g. openssl rand -hex 32}
      - MODELS_DIR=/models
    networks:
      - woolwire_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # llama-server memory-maps weights read-only but needs scratch space.
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8192M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    user: "1000:1000"

networks:
  egress: {}
  woolwire_internal:
    internal: true

volumes:
  woolwire_state:
  woolwire_models:
